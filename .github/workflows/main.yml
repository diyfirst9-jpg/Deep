name: Build Deepdrop APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Release upload uses the repository contents permission.
# This avoids GitHub Actions artifact quota exhaustion.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 27.0.12077973 and CMake 3.22.1
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        working-directory: android-app
        run: chmod +x gradlew

      - name: Decode release keystore (optional)
        if: ${{ env.LSFGA_STORE_FILE_B64 != '' }}
        working-directory: android-app
        env:
          LSFGA_STORE_FILE_B64: ${{ secrets.LSFGA_STORE_FILE_B64 }}
        run: |
          echo "$LSFGA_STORE_FILE_B64" | base64 -d > release.keystore
          {
            echo "LSFGAndroid_STORE_FILE=release.keystore"
            echo "LSFGAndroid_STORE_PASSWORD=${{ secrets.LSFGA_STORE_PASSWORD }}"
            echo "LSFGAndroid_KEY_ALIAS=${{ secrets.LSFGA_KEY_ALIAS }}"
            echo "LSFGAndroid_KEY_PASSWORD=${{ secrets.LSFGA_KEY_PASSWORD }}"
          } >> gradle.properties

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        working-directory: android-app
        run: ./gradlew :app:assembleRelease --stacktrace

      # Upload the APK as a GitHub Release asset instead of an Actions artifact.
      # This avoids the Actions artifact storage quota that caused the previous build
      # to fail after both APK builds completed successfully.
      - name: Publish release APK
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: android-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_TAG="deepdrop-nightly"
          APK="app/build/outputs/apk/release/app-release.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Deepdrop Nightly" \
              --prerelease \
              --latest=false \
              --notes "Latest automated Deepdrop APK build."
          fi
